name: Verify feed

# Builds the site and checks that the prerendered homepage shows every expected
# card in order. Runs outside the Vercel build, so it can never block a deploy.
# Read-only: no secrets, no write permissions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-feed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify the feed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the feed renders every card in order
        run: npm run verify:feed
